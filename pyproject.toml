[project]
name = "onshape-copilot"
version = "0.1.0"
description = "MCP server exposing read-only Onshape CAD queries (mass properties, BOM, revisions) to Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onshape_copilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
